# Windows CI — build ZowiDesktop portable .zip and Inno Setup installer.
#
# Manual trigger (workflow_dispatch), consistent with the project's manual-
# release philosophy: Windows binaries are built on demand and downloaded to be
# attached to the GitHub Release (see packaging/create-gh-release.sh).
#
# The MSVC toolchain + Windows SDK are required because the native WinRT
# (bt_native) and Win32 serial (bt_serial_win) backends do not build with MinGW.

name: Windows CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: ver
        shell: bash
        run: |
          V=$(grep -oP 'project\(ZowiDesktop\s+VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Setup Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6 (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtconnectivity'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Disable dev mode for packaged build
        shell: pwsh
        run: |
          $f = "src/config.json"
          (Get-Content $f) -replace '("dev_mode"\s*:\s*")[^"]*(")', '$1false$2' | Set-Content $f

      - name: Configure CMake
        run: |
          cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DZOWI_BUILD_CLI=ON

      - name: Build
        run: cmake --build build-win --config Release

      - name: Collect DLLs with windeployqt
        run: |
          New-Item -ItemType Directory -Path dist -Force
          windeployqt --qmldir src\views --dir dist build-win\src\gui\Release\ZowiDesktop.exe

      - name: Copy executables
        run: |
          Copy-Item build-win\src\gui\Release\ZowiDesktop.exe dist\
          Copy-Item build-win\src\cli\Release\zowi_cli.exe dist\ -ErrorAction SilentlyContinue

      - name: Create portable zip
        shell: bash
        run: |
          cd dist
          7z a "../ZowiDesktop-${{ steps.ver.outputs.version }}-windows-x86_64.zip" .

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DVERSION=${{ steps.ver.outputs.version }} packaging\windows\installer\zowi-desktop.iss

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: ZowiDesktop-${{ steps.ver.outputs.version }}-windows-x86_64.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build-win/dist/ZowiDesktop-${{ steps.ver.outputs.version }}-setup-x64.exe
