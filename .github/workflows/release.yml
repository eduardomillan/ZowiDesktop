# Release — one-button, manually triggered end-to-end release.
#
# Keeps the project's manual-release philosophy (no automatic release on
# push/tag) while collapsing the multi-step process documented in
# docs/project/RELEASE.md into a single `workflow_dispatch` run:
#
#   1. Build selected Linux artifacts (AppImage, jammy .deb, noble .deb).
#   2. Build selected Windows artifacts (portable zip, setup installer).
#   3. Download requested artifacts into dist/ and run
#      packaging/create-gh-release.sh with corresponding flags, which reads
#      the version from the VERSION file, extracts notes from CHANGELOG.md,
#      tags, and creates the GitHub Release with the selected assets.
#
# Publishing the signed apt repository (--with-apt) is opt-in via the
# `publish_apt` input and requires the `APT_GPG_PRIVATE_KEY` and
# `APT_GPG_PASSPHRASE` secrets to be configured on the repository — see
# docs/project/RELEASE.md for details.

name: Release

on:
  workflow_dispatch:
    inputs:
      include_appimage:
        description: 'Linux: AppImage (.AppImage)'
        type: boolean
        default: true
      include_deb_jammy:
        description: 'Linux: Ubuntu 22.04 Jammy (.deb)'
        type: boolean
        default: true
      include_deb_noble:
        description: 'Linux: Ubuntu 24.04 Noble (.deb)'
        type: boolean
        default: true
      include_windows_zip:
        description: 'Windows: Portable zip (.zip)'
        type: boolean
        default: true
      include_windows_installer:
        description: 'Windows: Setup installer (.exe)'
        type: boolean
        default: true
      publish_apt:
        description: 'Also publish the signed apt repo (jammy+noble) to gh-pages'
        type: boolean
        default: false
      overwrite:
        description: 'Overwrite existing release and tag if they already exist'
        type: boolean
        default: false
      prerelease:
        description: 'Mark the GitHub Release as a pre-release (not latest)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    if: ${{ inputs.include_appimage || inputs.include_deb_jammy || inputs.include_deb_noble }}
    uses: ./.github/workflows/linux.yml
    with:
      build_appimage: ${{ inputs.include_appimage }}
      build_deb_jammy: ${{ inputs.include_deb_jammy }}
      build_deb_noble: ${{ inputs.include_deb_noble }}

  build-windows:
    if: ${{ inputs.include_windows_zip || inputs.include_windows_installer }}
    uses: ./.github/workflows/windows.yml
    with:
      build_zip: ${{ inputs.include_windows_zip }}
      build_installer: ${{ inputs.include_windows_installer }}

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    if: |
      always() &&
      (needs.build-linux.result == 'success' || needs.build-windows.result == 'success') &&
      needs.build-linux.result != 'cancelled' &&
      needs.build-windows.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Warn if Windows build did not succeed
        if: ${{ (inputs.include_windows_zip || inputs.include_windows_installer) && needs.build-windows.result != 'success' }}
        run: |
          echo "::warning::Windows build result was '${{ needs.build-windows.result }}' (expected success); releasing without Windows artifacts."

      - name: Download Linux artifacts
        if: ${{ needs.build-linux.result == 'success' }}
        uses: actions/download-artifact@v5
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true

      - name: Download Windows artifacts
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v5
        with:
          pattern: windows-*
          path: dist
          merge-multiple: true

      - name: Import apt signing key
        if: ${{ inputs.publish_apt }}
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "ERROR: publish_apt was requested but APT_GPG_PRIVATE_KEY secret is not set." >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y aptly gnupg
          echo "$APT_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          ARGS=()
          if [ "${{ inputs.include_appimage }}" = "false" ]; then
            ARGS+=(--skip-appimage)
          fi
          if [ "${{ inputs.include_deb_jammy }}" = "false" ]; then
            ARGS+=(--skip-deb-jammy)
          fi
          if [ "${{ inputs.include_deb_noble }}" = "false" ]; then
            ARGS+=(--skip-deb-noble)
          fi
          if [ "${{ inputs.include_windows_zip }}" = "false" ] || [ "${{ needs.build-windows.result }}" != "success" ]; then
            ARGS+=(--skip-windows-zip)
          fi
          if [ "${{ inputs.include_windows_installer }}" = "false" ] || [ "${{ needs.build-windows.result }}" != "success" ]; then
            ARGS+=(--skip-windows-installer)
          fi
          if [ "${{ inputs.publish_apt }}" = "true" ]; then
            if [ "${{ inputs.include_deb_jammy }}" = "false" ] || [ "${{ inputs.include_deb_noble }}" = "false" ]; then
              echo "ERROR: publish_apt requires both jammy and noble .deb packages to be included." >&2
              exit 1
            fi
            ARGS+=(--with-apt)
          fi
          if [ "${{ inputs.overwrite }}" = "true" ]; then
            ARGS+=(--overwrite)
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          bash packaging/create-gh-release.sh "${ARGS[@]}"

      - name: Remove imported apt signing key
        if: ${{ always() && inputs.publish_apt }}
        run: |
          for fpr in $(gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '/^fpr:/ {print $10}' | sort -u); do
            gpg --batch --yes --delete-secret-and-public-keys "$fpr" || true
          done
