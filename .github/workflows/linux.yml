# Linux release artifacts — build the AppImage and Debian packages.
#
# Manual trigger, matching the project's manual release philosophy. The
# resulting artifacts can be downloaded from the workflow and attached to a
# GitHub Release with packaging/create-gh-release.sh.

name: Linux CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: ver
        shell: bash
        run: |
          V=$(grep -oP 'project\(ZowiDesktop\s+VERSION\s+\K\S+(?=\s+LANGUAGES)' CMakeLists.txt)
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtconnectivity'

      - name: Configure Qt environment
        shell: bash
        run: |
          QMAKE_PATH=$(command -v qmake6 || command -v qmake)
          test -n "$QMAKE_PATH"
          echo "QT_ROOT_DIR=$(dirname "$(dirname "$QMAKE_PATH")")" >> "$GITHUB_ENV"

      - name: Build AppImage
        run: bash packaging/linux/create-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v5
        with:
          name: linux-appimage
          path: dist/ZowiDesktop-${{ steps.ver.outputs.version }}-x86_64.AppImage
          if-no-files-found: error

  deb-jammy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: ver
        shell: bash
        run: |
          V=$(grep -oP 'project\(ZowiDesktop\s+VERSION\s+\K\S+(?=\s+LANGUAGES)' CMakeLists.txt)
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake g++ pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-connectivity-dev \
            libbluetooth-dev nlohmann-json3-dev libcli11-dev \
            devscripts debhelper-compat \
            libgl1-mesa-dev libglu1-mesa-dev

      - name: Build Debian package
        env:
          DISTRO_SUFFIX: jammy
        run: bash packaging/linux/create-deb.sh

      - name: Upload Debian package
        uses: actions/upload-artifact@v5
        with:
          name: linux-deb-jammy
          path: dist/zowi-desktop_${{ steps.ver.outputs.version }}-1+jammy_amd64.deb
          if-no-files-found: error

  deb-noble:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: ver
        shell: bash
        run: |
          V=$(grep -oP 'project\(ZowiDesktop\s+VERSION\s+\K\S+(?=\s+LANGUAGES)' CMakeLists.txt)
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake g++ pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-connectivity-dev \
            libbluetooth-dev nlohmann-json3-dev libcli11-dev \
            devscripts debhelper-compat \
            libgl1-mesa-dev libglu1-mesa-dev

      - name: Build Debian package
        env:
          DISTRO_SUFFIX: noble
        run: bash packaging/linux/create-deb.sh

      - name: Upload Debian package
        uses: actions/upload-artifact@v5
        with:
          name: linux-deb-noble
          path: dist/zowi-desktop_${{ steps.ver.outputs.version }}-1+noble_amd64.deb
          if-no-files-found: error